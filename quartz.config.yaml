# Quartz 5 publication config for Physiotherapy Pocket Handbook
configuration:
  pageTitle: Physiotherapy Pocket Handbook
  pageTitleSuffix: " — Open Notes"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: id-ID
  baseUrl: "iqbalkopling01.github.io/bukusakti-picio"
  ignorePatterns:
    - private
    - _private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fbfaf8"
        lightgray: "#e8e5e1"
        gray: "#aaa4a0"
        darkgray: "#4b4745"
        dark: "#211f1e"
        secondary: "#9f1d20"
        tertiary: "#6f3b3d"
        highlight: "rgba(159, 29, 32, 0.10)"
        textHighlight: "#ffe08a88"
      darkMode:
        light: "#171616"
        lightgray: "#333030"
        gray: "#686262"
        darkgray: "#d6d0cd"
        dark: "#f2efed"
        secondary: "#ef6a6d"
        tertiary: "#d39b9d"
        highlight: "rgba(239, 106, 109, 0.12)"
        textHighlight: "#9d7b2088"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options: { enableInHtmlEmbed: false, enableCheckbox: true }
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout: { position: right, priority: 30 }
  - source: github:quartz-community/crawl-links
    enabled: true
    options: { markdownLinkResolution: shortest }
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options: { renderEngine: katex }
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options: { enableSiteMap: true, enableRSS: true }
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout: { position: left, priority: 50 }
  - source: github:quartz-community/graph
    enabled: true
    layout: { position: right, priority: 10 }
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions: { grow: true }
  - source: github:quartz-community/backlinks
    enabled: true
    layout: { position: right, priority: 50 }
  - source: github:quartz-community/article-title
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: github:quartz-community/content-meta
    enabled: true
    layout: { position: beforeBody, priority: 20 }
  - source: github:quartz-community/page-title
    enabled: true
    layout: { position: left, priority: 10 }
  - source: github:quartz-community/darkmode
    enabled: true
    layout: { position: left, priority: 30, group: toolbar }
  - source: github:quartz-community/reader-mode
    enabled: true
    layout: { position: left, priority: 35, group: toolbar }
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout: { position: beforeBody, priority: 5, condition: not-index }
  - source: github:quartz-community/comments
    enabled: false
    options: { provider: giscus, options: {} }
    layout: { position: afterBody, priority: 10 }
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}
    layout: { position: footer, priority: 50 }
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout: { position: left, priority: 25, display: mobile-only }
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties: [tags]
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout: { position: beforeBody, priority: 15, display: all }
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
layout:
  groups:
    toolbar: { priority: 35, direction: row, gap: 0.5rem }
  byPageType:
    "404":
      positions: { beforeBody: [], left: [], right: [] }
      content: {}
    folder:
      exclude: [reader-mode]
      positions: { right: [] }
    tag:
      exclude: [reader-mode]
      positions: { right: [] }
    canvas: {}
    bases: {}
